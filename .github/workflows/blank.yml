name: Daily Sector Flows

on:
  schedule:
    # Two crons cover daylight saving; the script only posts in the 4 PM ET hour.
    - cron: "30 20 * * 1-5"
    - cron: "30 21 * * 1-5"
  workflow_dispatch: {}

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance requests
      - run: python sector_flows.py ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
